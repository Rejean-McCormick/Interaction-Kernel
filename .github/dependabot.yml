version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/runtime/typescript"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    allow:
      - dependency-type: "direct"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"

  - package-ecosystem: "pip"
    directory: "/runtime/python"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    allow:
      - dependency-type: "direct"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
