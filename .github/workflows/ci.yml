name: conformance

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: interaction-kernel-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Python runtime
        run: python -m pip install -e runtime/python

      - name: Install TypeScript runtime
        run: npm install --prefix runtime/typescript --no-audit --no-fund

      - name: Run conformance suite
        run: bash scripts/test_all.sh
